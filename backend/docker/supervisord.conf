[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:api]
directory=/app/backend
command=uvicorn app.main:app --host 0.0.0.0 --port %(ENV_BACKEND_PORT)s
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:worker]
directory=/app/backend
command=python -m app.worker --queue %(ENV_WORKER_QUEUE)s --concurrency %(ENV_WORKER_CONCURRENCY)s
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
